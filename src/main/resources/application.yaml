server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/blog"
    username: "username"
    password: ${DB_PASSWORD:}
  application:
    name: blog
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  signerKey: ${SIGNER_KEY:}
  valid-duration: 3600
  refreshable-duration: 3600